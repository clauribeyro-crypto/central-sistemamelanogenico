{% extends "base.html" %}
{% block title %}Nova origem de lead · Sistema da Clínica{% endblock %}
{% block content %}
    <p><a href="{% url 'leads:kanban' %}">← Voltar</a></p>
    <div class="card">
        <h1>Nova origem de lead</h1>
        <form method="post" class="acao">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}<p style="color:#8f2e45;font-size:.8rem;">{{ error }}</p>{% endfor %}
                </div>
            {% endfor %}
            <button class="btn" type="submit">Cadastrar origem</button>
        </form>
    </div>
{% endblock %}
