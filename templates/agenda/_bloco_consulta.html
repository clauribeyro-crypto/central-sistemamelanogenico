<a class="bloco-consulta{% if consulta.status == "REALIZADA" %} realizada{% endif %}" style="background:{{ consulta.tipo_consulta.cor }};"
   href="{% url 'agenda:detalhe_consulta' consulta.pk %}"
   title="{{ consulta.paciente }} — {{ consulta.tipo_consulta }}{% if consulta.valor %} — R$ {{ consulta.valor|floatformat:2 }}{% endif %}{% if consulta.status == "REALIZADA" %} — Realizada{% endif %}">
    {% if consulta.status == "REALIZADA" %}✓ {% endif %}{{ consulta.data_hora|time:"H:i" }} — {{ consulta.paciente }}<br>
    {{ consulta.tipo_consulta }} · {{ consulta.profissional }}
    {% if consulta.valor %}
        <br><span class="bloco-consulta-valor">R$ {{ consulta.valor|floatformat:2 }}</span>
    {% endif %}
</a>
