<a class="bloco-consulta" style="background:{{ consulta.tipo_consulta.cor }};"
   href="/admin/agenda/consulta/{{ consulta.pk }}/change/"
   title="{{ consulta.paciente }} — {{ consulta.tipo_consulta }}{% if consulta.tipo_consulta.valor %} — R$ {{ consulta.tipo_consulta.valor|floatformat:2 }}{% endif %}">
    {{ consulta.data_hora|time:"H:i" }} — {{ consulta.paciente }}<br>
    {{ consulta.tipo_consulta }} · {{ consulta.profissional }}
    {% if consulta.tipo_consulta.valor %}
        <br><span class="bloco-consulta-valor">R$ {{ consulta.tipo_consulta.valor|floatformat:2 }}</span>
    {% endif %}
</a>
